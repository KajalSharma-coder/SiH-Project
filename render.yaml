services:
  - type: web
    name: fairtrade-backend
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ML_API_TIMEOUT_MS
        value: 10000
      - key: ML_SERVICE_URL
        fromService:
          name: fairtrade-ml
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: fairtrade-ml
    runtime: python
    buildCommand: pip install -r ml_service/requirements.txt
    startCommand: python -m uvicorn ml_service.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ML_MODEL_PATH
        value: artifacts/tanmay_price_model.joblib
      - key: DATABASE_URL
        sync: false
